<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini Live Transkriptor & Meeting-Tracker v0.5.0</title>
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-surface: #131b2e;
      --bg-card: #1c2640;
      --border-color: #2a3b61;
      --text-main: #f0f4fc;
      --text-muted: #8b9bb4;
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --speaker-a: #60a5fa;
      --speaker-b: #34d399;
      --speaker-c: #f472b6;
      --speaker-d: #fbbf24;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-area h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .version-tag {
      background-color: var(--accent-blue);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 800;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background-color: rgba(139, 155, 180, 0.15);
      color: var(--text-muted);
      border: 1px solid rgba(139, 155, 180, 0.3);
      transition: all 0.2s ease;
    }

    .badge-status.live {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
      border-color: rgba(239, 68, 68, 0.4);
    }

    .badge-status.processing {
      background-color: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      border-color: rgba(6, 182, 212, 0.4);
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: currentColor;
    }

    .badge-status.live .badge-dot {
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    .api-input-group {
      display: flex;
      gap: 6px;
    }

    .api-input {
      flex: 1;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      outline: none;
    }

    .api-input:focus {
      border-color: var(--accent-blue);
    }

    .btn-small {
      background-color: var(--border-color);
      color: #fff;
      border: none;
      padding: 0 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .controls-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 2px;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-start {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
    }

    .btn-start:disabled {
      background: #1e293b;
      color: #475569;
      cursor: not-allowed;
    }

    .btn-stop {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: #fff;
    }

    .btn-stop:disabled {
      background: #1e293b;
      color: #475569;
      cursor: not-allowed;
    }

    .audio-player-container {
      background-color: var(--bg-surface);
      padding: 8px 14px;
      border-bottom: 1px solid var(--border-color);
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    .audio-player-container.visible {
      display: flex;
    }

    .player-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    audio {
      flex: 1;
      height: 36px;
      border-radius: 6px;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    /* Live-Themen-Status-Monitor */
    .threads-card {
      background: linear-gradient(180deg, #162036, #0e1626);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
    }

    .threads-header {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent-cyan);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .threads-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .thread-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: rgba(255, 255, 255, 0.03);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .thread-status-badge {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .status-open {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-amber);
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .status-closed {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .thread-text {
      flex: 1;
      color: #e2e8f0;
    }

    .summary-card {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
      border: 1px solid var(--accent-cyan);
      border-radius: 12px;
      padding: 12px;
      display: none;
    }

    .summary-card.visible {
      display: block;
    }

    .summary-header {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .summary-content {
      font-size: 0.86rem;
      color: #e2e8f0;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .transcript-stream {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .transcript-item {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .transcript-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .speaker-tag {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background-color: rgba(255, 255, 255, 0.08);
    }

    .speaker-tag[data-speaker*="A"] { color: var(--speaker-a); border-left: 3px solid var(--speaker-a); }
    .speaker-tag[data-speaker*="B"] { color: var(--speaker-b); border-left: 3px solid var(--speaker-b); }
    .speaker-tag[data-speaker*="C"] { color: var(--speaker-c); border-left: 3px solid var(--speaker-c); }
    .speaker-tag[data-speaker*="D"] { color: var(--speaker-d); border-left: 3px solid var(--speaker-d); }

    .timestamp-btn {
      font-family: monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2px 5px;
      border-radius: 4px;
      cursor: pointer;
    }

    .timestamp-btn:active {
      color: #fff;
      background: var(--accent-blue);
    }

    .transcript-text {
      font-size: 0.88rem;
      color: var(--text-main);
      word-break: break-word;
    }

    .error-banner {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--accent-red);
      color: #fca5a5;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 6px;
      display: none;
      word-break: break-word;
    }

    .error-banner.visible {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="title-area">
        <h1>Gemini Tracker <span class="version-tag">v0.5.0</span></h1>
      </div>
      <div id="statusBadge" class="badge-status">
        <span class="badge-dot"></span>
        <span id="statusText">Bereit</span>
      </div>
    </div>

    <div class="api-input-group">
      <input type="password" id="apiKeyInput" class="api-input" placeholder="Google AI Studio API Key..." autocomplete="off">
      <button id="saveKeyBtn" class="btn-small">Speichern</button>
    </div>

    <div class="controls-panel">
      <button id="startBtn" class="btn-action btn-start">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        Aufnahme
      </button>
      <button id="stopBtn" class="btn-action btn-stop" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>
        Beenden
      </button>
    </div>
  </header>

  <div id="audioPlayerContainer" class="audio-player-container">
    <div class="player-row">
      <audio id="audioPlayback" controls preload="metadata"></audio>
      <button id="downloadTranscriptBtn" class="btn-small">Transkript (.txt)</button>
    </div>
  </div>

  <main id="mainScroll">
    <div id="errorBanner" class="error-banner"></div>

    <!-- Live Status der Themen & Gesprächsstränge -->
    <section class="threads-card">
      <div class="threads-header">
        <span>Gesprächsstränge & Status (Live)</span>
        <span id="threadCountBadge" style="font-size: 0.7rem; color: var(--text-muted);">Warte auf Sprache...</span>
      </div>
      <div id="threadsList" class="threads-list">
        <div style="font-size: 0.78rem; color: var(--text-muted); font-style: italic;">
          Starten Sie das Gespräch. Die KI erkennt behandelte Themen und zeigt an, welche noch offen oder bereits entschieden sind.
        </div>
      </div>
    </section>

    <!-- Finale Zusammenfassung -->
    <section id="summaryBox" class="summary-card">
      <div class="summary-header">Zusammenfassung & Beschlüsse</div>
      <div id="summaryContent" class="summary-content">Wird generiert...</div>
    </section>

    <!-- Detailiertes Live-Transkript -->
    <section id="transcriptContainer" class="transcript-stream"></section>
  </main>

  <script>
    (() => {
      'use strict';

      const CHUNK_INTERVAL_MS = 8000; // Alle 8 Sekunden wird ein Schnipsel analysiert
      let micStream = null;
      let totalMediaRecorder = null;
      let totalAudioChunks = [];
      let totalAudioBlobUrl = null;
      let isRecording = false;
      let recordingStartTime = 0;
      let chunkCounter = 0;
      let intervalTimer = null;
      let wakeLock = null;

      // Zustand der Besprechung
      const transcriptEntries = [];
      let currentTopics = []; // [{ topic: "", status: "OFFEN"|"BESCHLOSSEN", details: "" }]

      const apiKeyInput = document.getElementById('apiKeyInput');
      const saveKeyBtn = document.getElementById('saveKeyBtn');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const statusBadge = document.getElementById('statusBadge');
      const statusText = document.getElementById('statusText');
      const transcriptContainer = document.getElementById('transcriptContainer');
      const summaryBox = document.getElementById('summaryBox');
      const summaryContent = document.getElementById('summaryContent');
      const errorBanner = document.getElementById('errorBanner');
      const audioPlayerContainer = document.getElementById('audioPlayerContainer');
      const audioPlayback = document.getElementById('audioPlayback');
      const downloadTranscriptBtn = document.getElementById('downloadTranscriptBtn');
      const threadsList = document.getElementById('threadsList');
      const threadCountBadge = document.getElementById('threadCountBadge');
      const mainScroll = document.getElementById('mainScroll');

      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) apiKeyInput.value = savedKey;

      saveKeyBtn.addEventListener('click', () => {
        const k = apiKeyInput.value.trim();
        if (k) {
          localStorage.setItem('gemini_api_key', k);
          showError('API-Key gespeichert.', false);
        }
      });

      function setStatus(st, txt) {
        statusBadge.className = 'badge-status ' + st;
        statusText.textContent = txt;
      }

      function showError(msg, isErr = true) {
        errorBanner.textContent = msg;
        errorBanner.style.backgroundColor = isErr ? 'rgba(239, 68, 68, 0.15)' : 'rgba(16, 185, 129, 0.15)';
        errorBanner.style.borderColor = isErr ? 'var(--accent-red)' : 'var(--accent-green)';
        errorBanner.style.color = isErr ? '#fca5a5' : '#6ee7b7';
        errorBanner.classList.add('visible');
        if (!isErr) setTimeout(() => errorBanner.classList.remove('visible'), 3000);
      }

      function formatTime(sec) {
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = Math.floor(sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      }

      async function requestWakeLock() {
        if ('wakeLock' in navigator) {
          try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
        }
      }

      function releaseWakeLock() {
        if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
      }

      function blobToBase64(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onloadend = () => {
            const base64 = reader.result.split(',')[1];
            resolve(base64);
          };
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      // Aktualisiert die Anzeige der Gesprächsstränge in der UI
      function renderTopics(topics) {
        if (!topics || topics.length === 0) return;
        currentTopics = topics;
        threadsList.innerHTML = '';
        
        let openCount = 0;
        topics.forEach(t => {
          const isClosed = (t.status || '').toUpperCase() === 'BESCHLOSSEN' || (t.status || '').toUpperCase() === 'ABGESCHLOSSEN';
          if (!isClosed) openCount++;

          const item = document.createElement('div');
          item.className = 'thread-item';

          const badge = document.createElement('span');
          badge.className = `thread-status-badge ${isClosed ? 'status-closed' : 'status-open'}`;
          badge.textContent = isClosed ? '✓ Beschlossen' : '⏳ Noch offen';

          const desc = document.createElement('div');
          desc.className = 'thread-text';
          desc.innerHTML = `<strong>${escapeHtml(t.topic)}</strong>${t.details ? ': ' + escapeHtml(t.details) : ''}`;

          item.appendChild(badge);
          item.appendChild(desc);
          threadsList.appendChild(item);
        });

        threadCountBadge.textContent = `${openCount} Thema/Themen offen`;
      }

      function appendTranscriptItem(speaker, text, timeSec) {
        transcriptEntries.push({ speaker, text, timeSec });

        const item = document.createElement('div');
        item.className = 'transcript-item';

        const meta = document.createElement('div');
        meta.className = 'transcript-meta';

        const spk = document.createElement('span');
        spk.className = 'speaker-tag';
        spk.setAttribute('data-speaker', speaker);
        spk.textContent = speaker;

        const timeBtn = document.createElement('button');
        timeBtn.className = 'timestamp-btn';
        timeBtn.textContent = `⏱️ ${formatTime(timeSec)}`;
        timeBtn.onclick = () => {
          if (audioPlayback.src) {
            audioPlayback.currentTime = timeSec;
            audioPlayback.play();
          }
        };

        meta.appendChild(spk);
        meta.appendChild(timeBtn);

        const content = document.createElement('div');
        content.className = 'transcript-text';
        content.textContent = text;

        item.appendChild(meta);
        item.appendChild(content);
        transcriptContainer.appendChild(item);

        mainScroll.scrollTop = mainScroll.scrollHeight;
      }

      function escapeHtml(str) {
        return (str || '').replace(/[&<>'"]/g, 
          tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
      }

      // Verarbeitet ein Audio-Snippet mit Gemini 2.5 Flash
      async function analyzeAudioChunk(audioBlob, chunkStartSec) {
        const apiKey = apiKeyInput.value.trim();
        if (!apiKey) return;

        try {
          const base64Audio = await blobToBase64(audioBlob);

          // Bisherige Themen an den Prompt übergeben, damit die KI den roten Faden behält
          const knownTopicsSummary = currentTopics.map(t => `- ${t.topic} (${t.status})`).join('\n');

          const promptText = `
Du bist ein deutscher Besprechungsanalyst. 
Aufgabe:
1. Transkribiere das Audiosignal auf Deutsch. Ordne die Aussagen präzise Sprechern zu (z.B. "Sprecher A", "Sprecher B" oder Namen falls genannt).
2. Analysiere die Gesprächsstränge/Themen: Welche Themen werden besprochen? Sind sie "OFFEN" (Diskussion läuft noch, keine Einigung erzielt) oder "BESCHLOSSEN" (Entscheidung/Konsens getroffen)?
Bisherige bekannte Themen:
${knownTopicsSummary || 'Noch keine'}

Antworte AUSSCHLIESSLICH im folgenden gültigen JSON-Format (ohne Markdown, ohne Erklärungen):
{
  "dialog": [
    {"speaker": "Sprecher A", "text": "Aussage auf Deutsch..."},
    {"speaker": "Sprecher B", "text": "Antwort auf Deutsch..."}
  ],
  "topics": [
    {"topic": "Themenname", "status": "OFFEN" oder "BESCHLOSSEN", "details": "Kurzer Stand oder Beschluss"}
  ]
}
Wenn keine verständliche Sprache enthalten ist, gib leere Listen zurück.`;

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: promptText },
                  {
                    inline_data: {
                      mime_type: audioBlob.type || 'audio/webm',
                      data: base64Audio
                    }
                  }
                ]
              }],
              generationConfig: {
                response_mime_type: 'application/json',
                temperature: 0.1
              }
            })
          });

          if (!response.ok) {
            console.warn('Chunk Analyse HTTP-Fehler:', response.status);
            return;
          }

          const resData = await response.json();
          const rawReply = resData.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!rawReply) return;
