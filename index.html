<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini Transcriber v0.4.5</title>
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-surface: #131b2e;
      --bg-card: #1c2640;
      --border-color: #2a3b61;
      --text-main: #f0f4fc;
      --text-muted: #8b9bb4;
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --speaker-a: #60a5fa;
      --speaker-b: #34d399;
      --speaker-c: #f472b6;
      --speaker-d: #fbbf24;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-area h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .version-tag {
      background-color: var(--accent-blue);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 800;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background-color: rgba(139, 155, 180, 0.15);
      color: var(--text-muted);
      border: 1px solid rgba(139, 155, 180, 0.3);
      transition: all 0.2s ease;
    }

    .badge-status.connecting {
      background-color: rgba(245, 158, 11, 0.15);
      color: var(--accent-amber);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .badge-status.live {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
      border-color: rgba(239, 68, 68, 0.4);
    }

    .badge-status.processing {
      background-color: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      border-color: rgba(6, 182, 212, 0.4);
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: currentColor;
    }

    .badge-status.live .badge-dot {
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    .api-input-group {
      display: flex;
      gap: 6px;
    }

    .api-input {
      flex: 1;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      outline: none;
    }

    .api-input:focus {
      border-color: var(--accent-blue);
    }

    .btn-small {
      background-color: var(--border-color);
      color: #fff;
      border: none;
      padding: 0 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .model-selection-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .model-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .model-select {
      width: 100%;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--accent-cyan);
      font-weight: 600;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      outline: none;
    }

    .controls-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 2px;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-start {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
    }

    .btn-start:disabled {
      background: #1e293b;
      color: #475569;
      cursor: not-allowed;
    }

    .btn-stop {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: #fff;
    }

    .btn-stop:disabled {
      background: #1e293b;
      color: #475569;
      cursor: not-allowed;
    }

    .audio-player-container {
      background-color: var(--bg-surface);
      padding: 8px 14px;
      border-bottom: 1px solid var(--border-color);
      display: none;
    }

    .audio-player-container.visible {
      display: block;
    }

    audio {
      width: 100%;
      height: 36px;
      border-radius: 6px;
    }

    .debug-details {
      background-color: #050811;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .debug-summary {
      background-color: var(--bg-surface);
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent-cyan);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .debug-actions {
      display: flex;
      gap: 6px;
    }

    .btn-console {
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      cursor: pointer;
    }

    .debug-log-view {
      padding: 8px 12px;
      font-family: monospace;
      font-size: 0.72rem;
      line-height: 1.4;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: #94a3b8;
    }

    .log-entry { margin-bottom: 3px; }
    .log-info { color: #38bdf8; }
    .log-success { color: #4ade80; }
    .log-warn { color: #facc15; }
    .log-error { color: #f87171; }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .summary-card {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
      border: 1px solid var(--accent-cyan);
      border-radius: 12px;
      padding: 12px;
      display: none;
    }

    .summary-card.visible {
      display: block;
    }

    .summary-header {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .summary-content {
      font-size: 0.86rem;
      color: #e2e8f0;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .transcript-stream {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .transcript-item {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .transcript-item.overlap {
      border-color: var(--accent-amber);
      background-color: rgba(245, 158, 11, 0.06);
    }

    .transcript-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .speaker-tag {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background-color: rgba(255, 255, 255, 0.08);
    }

    .speaker-tag[data-speaker*="A"] { color: var(--speaker-a); border-left: 3px solid var(--speaker-a); }
    .speaker-tag[data-speaker*="B"] { color: var(--speaker-b); border-left: 3px solid var(--speaker-b); }
    .speaker-tag[data-speaker*="C"] { color: var(--speaker-c); border-left: 3px solid var(--speaker-c); }
    .speaker-tag[data-speaker*="D"] { color: var(--speaker-d); border-left: 3px solid var(--speaker-d); }

    .timestamp-btn {
      font-family: monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2px 5px;
      border-radius: 4px;
      cursor: pointer;
    }

    .timestamp-btn:active {
      color: #fff;
      background: var(--accent-blue);
    }

    .overlap-badge {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--accent-amber);
      background: rgba(245, 158, 11, 0.15);
      padding: 2px 5px;
      border-radius: 4px;
      margin-left: auto;
    }

    .transcript-text {
      font-size: 0.88rem;
      color: var(--text-main);
      word-break: break-word;
    }

    .error-banner {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--accent-red);
      color: #fca5a5;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 6px;
      display: none;
      word-break: break-word;
    }

    .error-banner.visible {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="title-area">
        <h1>Gemini Transcriber <span class="version-tag">v0.4.5</span></h1>
      </div>
      <div id="statusBadge" class="badge-status">
        <span class="badge-dot"></span>
        <span id="statusText">Bereit</span>
      </div>
    </div>

    <div class="api-input-group">
      <input type="password" id="apiKeyInput" class="api-input" placeholder="Google AI Studio API Key..." autocomplete="off">
      <button id="saveKeyBtn" class="btn-small">Speichern</button>
      <button id="loadModelsBtn" class="btn-small">Modelle laden</button>
    </div>

    <div class="model-selection-box">
      <div class="model-label">
        <span>Aktives Modell für Live WebSocket:</span>
        <span id="modelCountLabel"></span>
      </div>
      <select id="modelSelect" class="model-select">
        <option value='{"name":"models/gemini-2.0-flash-exp","version":"v1alpha"}'>[Empfohlen] gemini-2.0-flash-exp (v1alpha)</option>
        <option value='{"name":"models/gemini-2.5-flash-native-audio-latest","version":"v1beta"}'>[Native Audio] gemini-2.5-flash-native-audio-latest (v1beta)</option>
        <option value='{"name":"models/gemini-2.0-flash-realtime-exp","version":"v1beta"}'>[Realtime] gemini-2.0-flash-realtime-exp (v1beta)</option>
      </select>
    </div>

    <div class="controls-panel">
      <button id="startBtn" class="btn-action btn-start">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        Aufnahme
      </button>
      <button id="stopBtn" class="btn-action btn-stop" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>
        Stoppen
      </button>
    </div>
  </header>

  <div id="audioPlayerContainer" class="audio-player-container">
    <audio id="audioPlayback" controls preload="metadata"></audio>
  </div>

  <main id="mainScroll">
    <div id="errorBanner" class="error-banner"></div>

    <details id="debugDetails" class="debug-details" open>
      <summary class="debug-summary">
        <span>🛠️ Debug-Konsole</span>
        <div class="debug-actions">
          <button id="copyLogBtn" class="btn-console" type="button">Kopieren</button>
          <button id="clearLogBtn" class="btn-console" type="button">Leeren</button>
        </div>
      </summary>
      <div id="debugLogView" class="debug-log-view"></div>
    </details>

    <section id="summaryBox" class="summary-card">
      <div class="summary-header">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Besprechungs-Zusammenfassung
      </div>
      <div id="summaryContent" class="summary-content">Erstelle Zusammenfassung...</div>
    </section>

    <section id="transcriptContainer" class="transcript-stream"></section>
  </main>

  <script>
    (() => {
      'use strict';

      const WORKLET_CODE = `
        class PcmProcessor extends AudioWorkletProcessor {
          constructor() {
            super();
            this.bufferSize = 4096;
            this.buffer = new Float32Array(this.bufferSize);
            this.bytesWritten = 0;
          }

          process(inputs) {
            const input = inputs[0];
            if (!input || !input[0]) return true;
            const channel = input[0];

            for (let i = 0; i < channel.length; i++) {
              this.buffer[this.bytesWritten++] = channel[i];
              if (this.bytesWritten >= this.bufferSize) {
                this.flush();
              }
            }
            return true;
          }

          flush() {
            const pcm16 = new Int16Array(this.bytesWritten);
            for (let i = 0; i < this.bytesWritten; i++) {
              let s = Math.max(-1, Math.min(1, this.buffer[i]));
              pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            this.port.postMessage(pcm16.buffer, [pcm16.buffer]);
            this.bytesWritten = 0;
          }
        }
        registerProcessor('pcm-processor', PcmProcessor);
      `;

      let audioCtx = null;
      let micStream = null;
      let mediaRecorder = null;
      let recordedChunks = [];
      let recordedBlobUrl = null;
      let workletNode = null;
      let scriptNode = null;
      let websocket = null;
      let wakeLock = null;
      let recordingStartTime = 0;
      let isRecording = false;
      let isAwaitingSummary = false;
      let isHandshakeComplete = false;
      let textChunkBuffer = '';

      const apiKeyInput = document.getElementById('apiKeyInput');
      const saveKeyBtn = document.getElementById('saveKeyBtn');
      const loadModelsBtn = document.getElementById('loadModelsBtn');
      const modelSelect = document.getElementById('modelSelect');
      const modelCountLabel = document.getElementById('modelCountLabel');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const statusBadge = document.getElementById('statusBadge');
      const statusText = document.getElementById('statusText');
      const transcriptContainer = document.getElementById('transcriptContainer');
      const summaryBox = document.getElementById('summaryBox');
      const summaryContent = document.getElementById('summaryContent');
      const errorBanner = document.getElementById('errorBanner');
      const audioPlayerContainer = document.getElementById('audioPlayerContainer');
      const audioPlayback = document.getElementById('audioPlayback');
      const mainScroll = document.getElementById('mainScroll');
      const debugLogView = document.getElementById('debugLogView');
      const copyLogBtn = document.getElementById('copyLogBtn');
      const clearLogBtn = document.getElementById('clearLogBtn');

      function log(message, type = 'info') {
        const time = new Date().toISOString().split('T')[1].replace('Z', '');
        const entry = document.createElement('div');
        entry.className = `log-entry log-${type}`;
        entry.textContent = `[${time}] ${message}`;
        debugLogView.appendChild(entry);
        debugLogView.scrollTop = debugLogView.scrollHeight;
      }

      copyLogBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const text = Array.from(debugLogView.children).map(c => c.textContent).join('\n');
        navigator.clipboard.writeText(text).then(() => {
          showError('Logs in Zwischenablage kopiert.', false);
        }).catch(() => {
          showError('Kopieren fehlgeschlagen.');
        });
      });

      clearLogBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        debugLogView.innerHTML = '';
        log('Log-Konsole geleert.');
      });

      log('App gestartet (v0.4.5).');

      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        apiKeyInput.value = savedKey;
        log('Gespeicherter API-Key geladen.');
      }

      saveKeyBtn.addEventListener('click', () => {
        const key = apiKeyInput.value.trim();
        if (key) {
          localStorage.setItem('gemini_api_key', key);
          log('API-Key lokal gesichert.', 'success');
          showError('API-Key erfolgreich gespeichert.', false);
        }
      });

      function setStatus(status, text) {
        statusBadge.className = 'badge-status ' + status;
        statusText.textContent = text;
      }

      function showError(msg, isError = true) {
        errorBanner.textContent = msg;
        errorBanner.style.backgroundColor = isError ? 'rgba(239, 68, 68, 0.15)' : 'rgba(16, 185, 129, 0.15)';
        errorBanner.style.borderColor = isError ? 'var(--accent-red)' : 'var(--accent-green)';
        errorBanner.style.color = isError ? '#fca5a5' : '#6ee7b7';
        errorBanner.classList.add('visible');
        if (!isError) {
          setTimeout(() => errorBanner.classList.remove('visible'), 3000);
        }
      }

      function clearError() {
        errorBanner.classList.remove('visible');
      }

      async function requestWakeLock() {
        if ('wakeLock' in navigator) {
          try {
            wakeLock = await navigator.wakeLock.request('screen');
            log('Wake Lock aktiviert.', 'info');
          } catch (err) {
            log('Wake Lock Warnung: ' + err.message, 'warn');
          }
        }
      }

      function releaseWakeLock() {
        if (wakeLock) {
          wakeLock.release().catch(() => {});
          wakeLock = null;
        }
      }

      function arrayBufferToBase64(buffer) {
        let binary = '';
        const bytes = new Uint8Array(buffer);
        const len = bytes.byteLength;
        for (let i = 0; i < len; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return window.btoa(binary);
      }

      function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = Math.floor(seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      }

      // Holt ALLE Modelle von Google und baut sie ins Dropdown ein
      async function populateModelsFromAPI(apiKey) {
        log('Lade alle Modell-Listen von der Google API...', 'info');
        const endpoints = [
          { ver: 'v1alpha', url: `https://generativelanguage.googleapis.com/v1alpha/models?key=${apiKey}` },
          { ver: 'v1beta', url: `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}` }
        ];

        const allModels = [];
        const seen = new Set();

        for (const ep of endpoints) {
          try {
            const res = await fetch(ep.url);
            if (res.ok) {
              const data = await res.json();
              const list = data.models || [];
              log(`Gefunden in [${ep.ver}]: ${list.length} Modelle.`, 'info');

              for (const m of list) {
                const key = `${m.name}|${ep.ver}`;
                if (!seen.has(key)) {
                  seen.add(key);
                  allModels.push({
                    name: m.name,
                    version: ep.ver,
                    displayName: m.displayName || m.name.replace('models/', ''),
                    isAudioOrFlash: m.name.includes('flash') || m.name.includes('audio') || m.name.includes('live') || m.name.includes('realtime')
                  });
                }
              }
            } else {
              log(`Abfrage [${ep.ver}] HTTP ${res.status}`, 'warn');
            }
          } catch (e) {
            log(`Fehler beim Abruf [${ep.ver}]: ${e.message}`, 'error');
          }
        }

        if (allModels.length === 0) {
          showError('Keine Modelle von der API empfangen. Key prüfen.');
          return;
        }

        // Sortierung: Flash/Audio/Live zuerst nach oben
        allModels.sort((a, b) => {
          if (a.isAudioOrFlash && !b.isAudioOrFlash) return -1;
          if (!a.isAudioOrFlash && b.isAudioOrFlash) return 1;
          return a.name.localeCompare(b.name);
        });

        // Dropdown leeren und mit echten API-Modellen füllen
        modelSelect.innerHTML = '';

        // Manuell hinzugefügte primäre Live-Optionen an die Spitze setzen
        const topDefaults = [
          { name: 'models/gemini-2.0-flash-exp', version: 'v1alpha', tag: '⭐ Empfohlen (v1alpha Live)' },
          { name: 'models/gemini-2.5-flash-native-audio-latest', version: 'v1beta', tag: '⭐ Native Audio (v1beta)' },
          { name: 'models/gemini-2.0-flash-realtime-exp', version: 'v1beta', tag: '⭐ Realtime Exp (v1beta)' }
        ];

        topDefaults.forEach(def => {
          const opt = document.createElement('option');
          opt.value = JSON.stringify({ name: def.name, version: def.version });
          opt.textContent = `${def.tag}: ${def.name}`;
          modelSelect.appendChild(opt);
        });

        // Trennlinie / Gruppe
        const group = document.createElement('optgroup');
        group.label = `API-Modelle deines Accounts (${allModels.length} verfügbar)`;

        allModels.forEach(m => {
          const opt = document.createElement('option');
          opt.value = JSON.stringify({ name: m.name, version: m.version });
          opt.textContent = `${m.name} (${m.version})`;
          group.appendChild(opt);
        });

        modelSelect.appendChild(group);
        modelCountLabel.textContent = `(${allModels.length} geladen)`;
        log(`Dropdown mit ${allModels.length} Modellen erfolgreich aktualisiert!`, 'success');
        showError(`${allModels.length} API-Modelle in Dropdown geladen!`, false);
      }

      loadModelsBtn.addEventListener('click', async () => {
        const apiKey = apiKeyInput.value.trim();
        if (!apiKey) {
          showError('Bitte erst einen Key eingeben.');
          return;
        }
        await populateModelsFromAPI(apiKey);
      });

      function sendAudioChunk(arrayBuffer) {
        if (!websocket || websocket.readyState !== WebSocket.OPEN) return;
        if (!isHandshakeComplete || isAwaitingSummary) return;

        const base64Data = arrayBufferToBase64(arrayBuffer);
        websocket.send(JSON.stringify({
          realtimeInput: {
            mediaChunks: [{
              mimeType: 'audio/pcm;rate=16000',
              data: base64Data
            }]
          }
        }));
      }

      function processStreamedText(text) {
        textChunkBuffer += text;

        if (isAwaitingSummary) {
          summaryContent.textContent = textChunkBuffer;
          mainScroll.scrollTop = 0;
          return;
        }

        let lines = textChunkBuffer.split('\n');
        textChunkBuffer = lines.pop();

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed) continue;
          
          let parsed = null;
          try {
            parsed = JSON.parse(trimmed);
          } catch (e) {
            const jsonMatch = trimmed.match(/\{.*?\}/);
            if (jsonMatch) {
              try { parsed = JSON.parse(jsonMatch[0]); } catch (err) {}
            }
          }

          if (parsed && (parsed.speaker || parsed.text)) {
            renderTranscriptItem(parsed);
          }
        }
      }

      function renderTranscriptItem(data) {
        const timeOffsetSec = Math.max(0, (Date.now() - recordingStartTime) / 1000);
        const timeFormatted = formatTime(timeOffsetSec);

        const item = document.createElement('div');
        item.className = 'transcript-item' + (data.is_overlap ? ' overlap' : '');

        const meta = document.createElement('div');
        meta.className = 'transcript-meta';

        const spk = document.createElement('span');
        spk.className = 'speaker-tag';
        spk.setAttribute('data-speaker', data.speaker || 'Unbekannt');
        spk.textContent = data.speaker || 'Unbekannt';

        const timeBtn = document.createElement('button');
        timeBtn.className = 'timestamp-btn';
        timeBtn.innerHTML = `⏱️ ${timeFormatted}`;
        timeBtn.onclick = () => {
          if (audioPlayback.src) {
            audioPlayback.currentTime = timeOffsetSec;
            audioPlayback.play();
          }
        };

        meta.appendChild(spk);
        meta.appendChild(timeBtn);

        if (data.is_overlap) {
          const overlap = document.createElement('span');
          overlap.className = 'overlap-badge';
          overlap.textContent = 'Überlappung';
          meta.appendChild(overlap);
        }

        const content = document.createElement('div');
        content.className = 'transcript-text';
        content.textContent = data.text || '';

        item.appendChild(meta);
        item.appendChild(content);
        transcriptContainer.appendChild(item);

        mainScroll.scrollTop = mainScroll.scrollHeight;
      }

      async function startLiveSession() {
        clearError();
        const apiKey = apiKeyInput.value.trim();
        if (!apiKey) {
          showError('Bitte erst den Google AI Studio API-Key hinterlegen.');
          return;
        }

        transcriptContainer.innerHTML = '';
        summaryBox.classList.remove('visible');
        audioPlayerContainer.classList.remove('visible');
        textChunkBuffer = '';
        recordedChunks = [];
        isAwaitingSummary = false;
        isHandshakeComplete = false;

        startBtn.disabled = true;

        try {
          const selectedModelConfig = JSON.parse(modelSelect.value);
          log(`Start mit Modell: ${selectedModelConfig.name} [${selectedModelConfig.version}]`, 'info');

          setStatus('connecting', 'Initialisiere Mikrofon...');
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              channelCount: 1,
              sampleRate: 16000,
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });
          log('Mikrofon aktiviert.', 'success');

          let mimeType = 'audio/webm;codecs=opus';
          if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = '';
          mediaRecorder = mimeType ? new MediaRecorder(micStream, { mimeType }) : new MediaRecorder(micStream);
          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
          };
          mediaRecorder.start(1000);

          audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
          if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
          }

          const source = audioCtx.createMediaStreamSource(micStream);

          try {
            const blob = new Blob([WORKLET_CODE], { type: 'application/javascript' });
            const blobUrl = URL.createObjectURL(blob);
            await audioCtx.audioWorklet.addModule(blobUrl);
            workletNode = new AudioWorkletNode(audioCtx, 'pcm-processor');
            workletNode.port.onmessage = (event) => sendAudioChunk(event.data);
            source.connect(workletNode);
            workletNode.connect(audioCtx.destination);
            log('AudioWorkletNode aktiv.', 'info');
          } catch (workletError) {
            log('ScriptProcessor Fallback: ' + workletError.message, 'warn');
            scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);
            scriptNode.onaudioprocess = (e) => {
              const input = e.inputBuffer.getChannelData(0);
              const pcm16 = new Int16Array(input.length);
              for (let i = 0; i < input.length; i++) {
                let s = Math.max(-1, Math.min(1, input[i]));
                pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
              }
              sendAudioChunk(pcm16.buffer);
            };
            source.connect(scriptNode);
            scriptNode.connect(audioCtx.destination);
          }

          const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.${selectedModelConfig.version}.GenerativeService.BidiGenerateContent?key=${apiKey}`;
          log(`Verbinde WebSocket (${selectedModelConfig.version})...`, 'info');

          websocket = new WebSocket(wsUrl);

          websocket.onopen = () => {
            log('WebSocket verbunden. Sende Setup-Frame...', 'success');
            const setupPayload = {
              setup: {
                model: selectedModelConfig.name,
                generationConfig: {
                  responseModalities: ['TEXT'],
                  temperature: 0.1
                },
                systemInstruction: {
                  parts: [{
                    text: "Du bist ein akribischer Protokollant. Das Audiosignal stammt von einem Lautsprecher, über den mehrere Personen sprechen. Aufgaben: 1. Analysiere das Stimmprofil und unterscheide die Sprecher konsistent als [Sprecher A], [Sprecher B] etc. 2. Wenn reale Namen/Rollen genannt werden, nutze diese. 3. Bei Stimmengewirr/Lärm gib '[Stimmengewirr / Unverständlich]' aus. 4. Formatiere jede Ausgabe zwingend als JSON pro Zeile: {\"speaker\": \"Sprecher A\", \"text\": \"Gesagter Inhalt...\", \"is_overlap\": false}. Gib nur reines JSON aus, kein Markdown."
                  }]
                }
              }
            };
            websocket.send(JSON.stringify(setupPayload));
          };

          websocket.onmessage = async (event) => {
            let rawData = event.data;
            if (rawData instanceof Blob) {
              rawData = await rawData.text();
            }

            try {
              const resp = JSON.parse(rawData);

              if (resp.setupComplete || resp.setup_complete) {
                log('🎉 Handshake SetupComplete von Google empfangen!', 'success');
                isHandshakeComplete = true;
                recordingStartTime = Date.now();
                isRecording = true;
                await requestWakeLock();
                setStatus('live', 'Live-Aufnahme');
                stopBtn.disabled = false;
                return;
              }

              if (resp.serverContent?.modelTurn?.parts) {
                for (const part of resp.serverContent.modelTurn.parts) {
                  if (part.text) {
                    processStreamedText(part.text);
                  }
                }
              }
            } catch (err) {
              log('JSON Decode Warnung: ' + err.message, 'warn');
            }
          };

          websocket.onerror = (err) => {
            log('WebSocket Fehler aufgetreten!', 'error');
          };

          websocket.onclose = (e) => {
            log(`WebSocket onclose: Code=${e.code}, Reason="${e.reason}"`, e.code === 1000 ? 'info' : 'error');
            if (isRecording || !isHandshakeComplete) {
              let reasonMsg = e.reason ? ` (${e.reason})` : '';
              if (e.code === 1008) {
                showError(`API-Fehler (1008 Policy Violation): ${reasonMsg || 'Modell wird nicht unterstützt.'}`);
              } else if (!e.wasClean) {
                showError(`Verbindung getrennt (Code ${e.code}).${reasonMsg}`);
              }
              stopLiveSession(false);
            }
          };

        } catch (err) {
          log('Fehler beim Start: ' + err.message, 'error');
          let msg = 'Fehler: ' + (err.message || err.name);
          if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
            msg += ' (HTTPS ist auf Mobilgeräten zwingend erforderlich!)';
          }
          showError(msg);
          cleanupResources();
          setStatus('', 'Bereit');
        }
      }

      async function stopLiveSession(requestSummary = true) {
        const wasActive = isRecording;
        isRecording = false;
        isHandshakeComplete = false;
        stopBtn.disabled = true;

        log('Stoppe Aufnahme...', 'info');

        if (micStream) {
          micStream.getTracks().forEach(t => t.stop());
          micStream = null;
        }
        if (workletNode) { workletNode.disconnect(); workletNode = null; }
        if (scriptNode) { scriptNode.disconnect(); scriptNode = null; }
        if (audioCtx && audioCtx.state !== 'closed') {
          audioCtx.close().catch(() => {});
        }

        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
            if (recordedBlobUrl) URL.revokeObjectURL(recordedBlobUrl);
            recordedBlobUrl = URL.createObjectURL(blob);
            audioPlayback.src = recordedBlobUrl;
            audioPlayerContainer.classList.add('visible');
            log('Audio-Wiedergabe bereit.', 'success');
          };
          mediaRecorder.stop();
        }

        releaseWakeLock();

        if (wasActive && requestSummary && websocket && websocket.readyState === WebSocket.OPEN) {
          setStatus('processing', 'Erstelle Zusammenfassung...');
          isAwaitingSummary = true;
          textChunkBuffer = '';
          summaryBox.classList.add('visible');
          summaryContent.textContent = 'Zusammenfassung wird geladen...';

          websocket.send(JSON.stringify({
            clientContent: {
              turns: [{
                role: 'user',
                parts: [{
                  text: 'Erstelle eine strukturierte Zusammenfassung der Besprechung: 1. Kernpunkte, 2. Beschlüsse, 3. Offene Aufgaben/To-Dos mit Zuordnung zu den Sprechern.'
                }]
              }],
              turnComplete: true
            }
          }));

          setTimeout(() => {
            cleanupWebSocket();
            setStatus('', 'Beendet');
            startBtn.disabled = false;
          }, 12000);
        } else {
          cleanupWebSocket();
          setStatus('', 'Beendet');
          startBtn.disabled = false;
        }
      }

      function cleanupWebSocket() {
        if (websocket) {
          websocket.onopen = null;
          websocket.onmessage = null;
          websocket.onerror = null;
          websocket.onclose = null;
          websocket.close();
          websocket = null;
        }
      }

      function cleanupResources() {
        if (micStream) {
          micStream.getTracks().forEach(t => t.stop());
          micStream = null;
        }
        if (audioCtx && audioCtx.state !== 'closed') {
          audioCtx.close().catch(() => {});
        }
        cleanupWebSocket();
        releaseWakeLock();
        startBtn.disabled = false;
        stopBtn.disabled = true;
      }

      startBtn.addEventListener('click', startLiveSession);
      stopBtn.addEventListener('click', () => stopLiveSession(true));
      window.addEventListener('beforeunload', cleanupResources);
    })();
  </script>
</body>
</html>
