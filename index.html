<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini Transcriber v0.4.0</title>
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-surface: #131b2e;
      --bg-card: #1c2640;
      --border-color: #2a3b61;
      --text-main: #f0f4fc;
      --text-muted: #8b9bb4;
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --speaker-a: #60a5fa;
      --speaker-b: #34d399;
      --speaker-c: #f472b6;
      --speaker-d: #fbbf24;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-area h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .version-tag {
      background-color: var(--accent-blue);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 800;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background-color: rgba(139, 155, 180, 0.15);
      color: var(--text-muted);
      border: 1px solid rgba(139, 155, 180, 0.3);
      transition: all 0.2s ease;
    }

    .badge-status.connecting {
      background-color: rgba(245, 158, 11, 0.15);
      color: var(--accent-amber);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .badge-status.live {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
      border-color: rgba(239, 68, 68, 0.4);
    }

    .badge-status.processing {
      background-color: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      border-color: rgba(6, 182, 212, 0.4);
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: currentColor;
    }

    .badge-status.live .badge-dot {
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    .api-input-group {
      display: flex;
      gap: 8px;
    }

    .api-input {
      flex: 1;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }

    .api-input:focus {
      border-color: var(--accent-blue);
    }

    .btn-key-save {
      background-color: var(--border-color);
      color: #fff;
      border: none;
      padding: 0 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .controls-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-start {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
    }

    .btn-start:disabled {
      background: #1e293b;
      color: #475569;
      cursor: not-allowed;
    }

    .btn-stop {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: #fff;
    }

    .btn-stop:disabled {
      background: #1e293b;
      color: #475569;
      cursor: not-allowed;
    }

    .audio-player-container {
      background-color: var(--bg-surface);
      padding: 8px 16px;
      border-bottom: 1px solid var(--border-color);
      display: none;
    }

    .audio-player-container.visible {
      display: block;
    }

    audio {
      width: 100%;
      height: 36px;
      border-radius: 6px;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .summary-card {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
      border: 1px solid var(--accent-cyan);
      border-radius: 12px;
      padding: 14px;
      display: none;
    }

    .summary-card.visible {
      display: block;
    }

    .summary-header {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .summary-content {
      font-size: 0.88rem;
      color: #e2e8f0;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .transcript-stream {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .transcript-item {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .transcript-item.overlap {
      border-color: var(--accent-amber);
      background-color: rgba(245, 158, 11, 0.06);
    }

    .transcript-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .speaker-tag {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      background-color: rgba(255, 255, 255, 0.08);
    }

    .speaker-tag[data-speaker*="A"] { color: var(--speaker-a); border-left: 3px solid var(--speaker-a); }
    .speaker-tag[data-speaker*="B"] { color: var(--speaker-b); border-left: 3px solid var(--speaker-b); }
    .speaker-tag[data-speaker*="C"] { color: var(--speaker-c); border-left: 3px solid var(--speaker-c); }
    .speaker-tag[data-speaker*="D"] { color: var(--speaker-d); border-left: 3px solid var(--speaker-d); }

    .timestamp-btn {
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    .timestamp-btn:active {
      color: #fff;
      background: var(--accent-blue);
    }

    .overlap-badge {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--accent-amber);
      background: rgba(245, 158, 11, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: auto;
    }

    .transcript-text {
      font-size: 0.92rem;
      color: var(--text-main);
      word-break: break-word;
    }

    .error-banner {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--accent-red);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 8px;
      display: none;
      word-break: break-word;
    }

    .error-banner.visible {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="title-area">
        <h1>Gemini Transcriber <span class="version-tag">v0.4.0</span></h1>
      </div>
      <div id="statusBadge" class="badge-status">
        <span class="badge-dot"></span>
        <span id="statusText">Bereit</span>
      </div>
    </div>

    <div class="api-input-group">
      <input type="password" id="apiKeyInput" class="api-input" placeholder="Google AI Studio API Key..." autocomplete="off">
      <button id="saveKeyBtn" class="btn-key-save">Speichern</button>
    </div>

    <div class="controls-panel">
      <button id="startBtn" class="btn-action btn-start">
